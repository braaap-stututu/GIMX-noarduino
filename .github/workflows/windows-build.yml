name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true

      - name: Build
        run: scripts/build-windows.sh --deps

      - uses: actions/upload-artifact@v4
        with:
          name: gimx-windows
          path: setup/
